spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: hotel-management

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hotel_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_USER:hotel_app}
    password: ${MYSQL_PASSWORD:hotel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 2000ms

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
    default-encoding: UTF-8

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.hotelmanagement
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

hotel:
  jobs:
    hold-expiry-enabled: ${HOLD_EXPIRY_ENABLED:true}
    hold-expiry-delay: ${HOLD_EXPIRY_DELAY:1m}
    no-show-enabled: ${NO_SHOW_ENABLED:true}
    no-show-delay: ${NO_SHOW_DELAY:1h}
    expired-token-cleanup-enabled: ${EXPIRED_TOKEN_CLEANUP_ENABLED:true}
    expired-token-cleanup-delay: ${EXPIRED_TOKEN_CLEANUP_DELAY:1h}
    expired-token-retention: ${EXPIRED_TOKEN_RETENTION:30d}

logging:
  level:
    root: INFO
    org.hibernate.SQL: ${LOG_SQL_LEVEL:INFO}
    org.hibernate.type.descriptor.sql.BasicBinder: ${LOG_SQL_BIND_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  hotel:
    time-zone: ${HOTEL_TIME_ZONE:Asia/Ho_Chi_Minh}
  email:
    worker-enabled: ${EMAIL_WORKER_ENABLED:true}
    poll-interval: ${EMAIL_POLL_INTERVAL:2s}
    retry-delay: ${EMAIL_RETRY_DELAY:30s}
    sending-timeout: ${EMAIL_SENDING_TIMEOUT:5m}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:3}
    batch-size: ${EMAIL_BATCH_SIZE:20}
    provider: ${EMAIL_PROVIDER:SMTP}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@tripstay.vn}
    from-name: ${EMAIL_FROM_NAME:TripStay}
    reply-to: ${EMAIL_REPLY_TO:support@tripstay.vn}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:${MINIO_ROOT_USER:}}
    secret-key: ${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD:}}
    initialize-on-startup: ${MINIO_INITIALIZE_ON_STARTUP:true}
    room-images-bucket: ${MINIO_ROOM_IMAGES_BUCKET:room-images}
    room-type-images-bucket: ${MINIO_ROOM_TYPE_IMAGES_BUCKET:room-type-images}
    avatars-bucket: ${MINIO_AVATARS_BUCKET:avatars}
    upload-url-ttl: ${MINIO_UPLOAD_URL_TTL:1h}
    download-url-ttl: ${MINIO_DOWNLOAD_URL_TTL:15m}
    max-image-size-bytes: ${ROOM_IMAGE_MAX_SIZE_BYTES:10485760}
    max-images-per-room: ${ROOM_IMAGE_MAX_COUNT:20}
    invoices-bucket: ${MINIO_INVOICES_BUCKET:invoices}
    invoice-pdf-url-ttl: ${MINIO_INVOICE_PDF_URL_TTL:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
  auth:
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    lock-duration: ${AUTH_LOCK_DURATION:15m}
    email-verification-token-ttl: ${AUTH_EMAIL_VERIFICATION_TOKEN_TTL:24h}
    email-verification-resend-cooldown: ${AUTH_EMAIL_VERIFICATION_RESEND_COOLDOWN:1m}
    password-reset-token-ttl: ${AUTH_PASSWORD_RESET_TOKEN_TTL:30m}
    frontend-verify-url: ${FRONTEND_VERIFY_URL:http://localhost:3000/auth/verify-email}
    frontend-reset-url: ${FRONTEND_RESET_URL:http://localhost:3000/auth/reset-password}
    frontend-staff-invitation-url: ${FRONTEND_STAFF_INVITATION_URL:http://localhost:3000/staff-invitation}
  guest-document:
    encryption-key: ${GUEST_DOCUMENT_ENCRYPTION_KEY:}
    lookup-hmac-key: ${GUEST_DOCUMENT_LOOKUP_HMAC_KEY:}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
      frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:3000/auth/google/callback}
  payment:
    default-provider: ${PAYMENT_DEFAULT_PROVIDER:SEPAY}
    e-wallet-provider: ${PAYMENT_E_WALLET_PROVIDER:MOCK_WALLET}
    checkout-ttl: ${PAYMENT_CHECKOUT_TTL:10m}
    mock-wallet:
      enabled: ${PAYMENT_MOCK_WALLET_ENABLED:false}
      checkout-base-url: ${PAYMENT_MOCK_WALLET_CHECKOUT_URL:http://localhost:3000/payment/mock-wallet}
    sepay:
      checkout-endpoint: ${SEPAY_CHECKOUT_ENDPOINT:https://pay-sandbox.sepay.vn/v1/checkout/init}
      merchant-id: ${SEPAY_MERCHANT_ID:}
      secret-key: ${SEPAY_SECRET_KEY:}
      success-url: ${SEPAY_SUCCESS_URL:}
      error-url: ${SEPAY_ERROR_URL:}
      cancel-url: ${SEPAY_CANCEL_URL:}
