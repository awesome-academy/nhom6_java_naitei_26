spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:hotel_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQL_USER:hotel_app}
    password: ${MYSQL_PASSWORD:hotel_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG

app:
  payment:
    mock-wallet:
      enabled: ${PAYMENT_MOCK_WALLET_ENABLED:true}
