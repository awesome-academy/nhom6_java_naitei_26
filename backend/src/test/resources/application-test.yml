spring:
  datasource:
    url: jdbc:h2:mem:hotel_management_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  redis:
    host: localhost
    port: 6379
    password:

  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: test-jwt-secret-for-auth-service-tests-32-bytes-minimum
    access-token-ttl: 1h
    refresh-token-ttl: 7d
  auth:
    max-failed-login-attempts: 5
    lock-duration: 15m
