spring:
  datasource:
    url: jdbc:h2:mem:hotel_management_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  redis:
    host: localhost
    port: 6379
    password:

  mail:
    host: localhost
    port: 1025

app:
  email:
    worker-enabled: false
  minio:
    endpoint: http://localhost:9000
    access-key: test-minio-access-key
    secret-key: test-minio-secret-key
    initialize-on-startup: false
    room-images-bucket: room-images-test
    room-type-images-bucket: room-type-images-test
    avatars-bucket: avatars-test
    upload-url-ttl: 1h
    download-url-ttl: 15m
    max-image-size-bytes: 10485760
    max-images-per-room: 20
  jwt:
    secret: test-jwt-secret-for-auth-service-tests-32-bytes-minimum
    access-token-ttl: 1h
    refresh-token-ttl: 7d
  auth:
    max-failed-login-attempts: 5
    lock-duration: 15m
  payment:
    mock-wallet:
      enabled: true
      checkout-base-url: http://localhost:3000/payment/mock-wallet

hotel:
  jobs:
    hold-expiry-enabled: false
    no-show-enabled: false
    expired-token-cleanup-enabled: false
